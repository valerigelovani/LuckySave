<div class="shell">
  <aside class="shell__rail">
    <a routerLink="/dashboard" class="rail__logo" aria-label="LuckySave home">
      <span class="rail__logo-mark">
        <mat-icon aria-hidden="true">savings</mat-icon>
      </span>
      <span class="rail__logo-text">LuckySave</span>
    </a>

    <nav class="rail__nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="rail__link--active"
          class="rail__link"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <a routerLink="/profile" routerLinkActive="rail__user--active" class="rail__user">
      <app-member-avatar
        [initials]="currentUser().avatarInitials"
        [color]="currentUser().avatarColor"
        [size]="36"
      ></app-member-avatar>
      <span class="rail__user-name">{{ currentUser().name }}</span>
    </a>
  </aside>

  <div class="shell__main">
    <header class="shell__topbar">
      <a routerLink="/dashboard" class="topbar__brand">
        <span class="topbar__brand-mark">
          <mat-icon aria-hidden="true">savings</mat-icon>
        </span>
        <span>LuckySave</span>
      </a>
      <a routerLink="/profile" class="topbar__avatar">
        <app-member-avatar
          [initials]="currentUser().avatarInitials"
          [color]="currentUser().avatarColor"
          [size]="34"
        ></app-member-avatar>
      </a>
    </header>

    <main class="shell__content">
      <div class="ls-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <nav class="shell__bottom-nav" aria-label="Primary">
    @for (item of primaryNavItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="bottom-nav__link--active" class="bottom-nav__link">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>

<app-toast-container></app-toast-container>
